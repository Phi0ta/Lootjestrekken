<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>{% block title %}{% endblock %} - Leuke Lootjes</title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <script src="/static/script.js" defer></script>
        <link rel="stylesheet" href="/static/style.css">
        <link rel="icon" type="image/x-icon" href="/static/img/favicon.ico">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Comic+Relief:wght@400;700&family=Lavishly+Yours&display=swap" rel="stylesheet">
        {% block head %}{% endblock %}
    </head>
    <div id="top_bar">
        {% block nav %}
        <nav>
            <a href="/">Home</a>
            <a href="/berichten">Berichten</a>
            <a href="/lijstjes">Lijstjes</a>
        </nav>
        {% endblock %}
    </div>
    <body>
        {% block content %}
        {% endblock %}
    </body>
    {% block footer %}
        <footer>
                {% if logged_in_user %}
                    Logged in as <span class="username_text">{{ logged_in_user }}</span><br>
                    <a href="/auth/logout">Log out</a>
                {% else %}
                    You are not logged in.
                {% endif %}
        </footer>
    {% endblock %}
</html>
